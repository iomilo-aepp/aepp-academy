<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101b36"><title>ΑΕΠΠ Academy · Level 1</title><meta name="description" content="Διαδραστικά challenges ΑΕΠΠ για κινητό."><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23101b36'/%3E%3Cpath d='M19 33l9 9 18-20' fill='none' stroke='%23f8cc62' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#edf3ff;background:#0c1428}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 90% 0,#253f73 0,transparent 32rem),#0c1428}main{max-width:720px;margin:auto;padding:24px 18px 56px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:25px}.brand{font-weight:900;letter-spacing:.08em;color:#f8cc62}.eyebrow{color:#a9b9d7;font-size:.9rem}h1{font-size:clamp(1.65rem,6vw,2.5rem);line-height:1.15;margin:8px 0 12px}.card{background:#16243f;border:1px solid #334769;border-radius:22px;padding:22px;box-shadow:0 18px 45px #0003}.topline{display:flex;justify-content:space-between;gap:12px;align-items:center;font-weight:700}.pill{background:#293d5d;border-radius:99px;padding:8px 12px;color:#f8cc62;white-space:nowrap}.bar{height:10px;background:#34435e;border-radius:99px;overflow:hidden;margin:18px 0 8px}.fill{height:100%;width:0;background:#f8cc62;transition:width .3s}.muted{color:#b7c5dc}.question{font-size:1.2rem;font-weight:700;line-height:1.4;margin:18px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0b152c;border:1px solid #3e5274;border-radius:14px;padding:17px;color:#c8e5ff;font-size:1rem;line-height:1.6}fieldset{border:0;margin:17px 0 0;padding:0}label.option{display:flex;gap:12px;align-items:center;min-height:54px;padding:12px 14px;border:1px solid #4a5f7f;border-radius:12px;margin:9px 0;cursor:pointer}label.option:has(input:checked){border-color:#f8cc62;background:#2d3c52}input{accent-color:#f8cc62;width:19px;height:19px}button{min-height:48px;border-radius:12px;font:inherit;font-weight:750;cursor:pointer;padding:11px 16px}button.primary{width:100%;background:#f8cc62;color:#17223b;border:0;margin-top:12px}button.secondary{background:transparent;color:#eaf0fd;border:1px solid #647899}button:disabled{opacity:.5;cursor:default}.namebox{margin-top:16px}.namebox label{display:block;font-weight:700;margin-bottom:8px}.namebox input{width:100%;height:52px;border-radius:12px;border:1px solid #647899;background:#0b152c;color:#edf3ff;padding:12px 14px;font:inherit}.namebox input:focus{outline:2px solid #f8cc62}.identity{color:#f8cc62;font-weight:800;margin-bottom:8px}.row{display:flex;gap:10px;margin-top:10px}.row button{flex:1}.feedback{margin-top:14px;padding:15px;background:#263a59;border-radius:12px;line-height:1.5}#next{width:100%;margin-top:14px}#finish{text-align:center}#finish strong{color:#f8cc62;font-size:2.3rem}.hidden{display:none!important}@media(max-width:400px){.card{padding:17px}.topline{align-items:flex-start}.row{flex-direction:column}}</style></head><body><main><header><div class="brand">ΑΕΠΠ ACADEMY</div><div class="eyebrow">LEVEL 01 / 08</div></header><section class="card"><div class="topline"><span>Μεταβλητές & εκχώρηση</span><span class="pill"><span id="xp">0</span> / 100 XP</span></div><div class="bar" aria-label="Πρόοδος XP"><div id="bar" class="fill"></div></div><div class="muted" id="count">Challenge 1 από 10</div></section><section class="card namebox" id="entry"><h1>Πριν ξεκινήσεις</h1><label for="studentName">Το όνομά σου</label><input id="studentName" type="text" maxlength="40" autocomplete="name" placeholder="π.χ. Μαρία Π." required><p class="muted">Το όνομά σου θα εμφανιστεί στο τελικό αποτέλεσμα.</p><button class="primary" id="start">Έναρξη παιχνιδιού</button><div class="feedback hidden" id="nameError" role="alert">Γράψε πρώτα το όνομά σου.</div></section><section class="card hidden" style="margin-top:16px" id="game"><div id="player" class="identity"></div><div class="eyebrow" id="badge"></div><h1 id="title"></h1><div class="question" id="question"></div><pre id="code"></pre><fieldset id="choices"><legend class="muted">Επίλεξε μία απάντηση</legend></fieldset><button class="primary" id="check">Έλεγχος απάντησης</button><div class="row"><button class="secondary" id="hint">💡 Υπόδειξη</button></div><div class="feedback hidden" id="feedback" role="status" aria-live="polite"></div><button class="secondary hidden" id="next">Επόμενο challenge →</button></section><section class="card hidden" style="margin-top:16px" id="finish"><div style="font-size:2.5rem">🏆</div><h1>Ολοκλήρωσες το Level 1</h1><div class="identity" id="finalName"></div><strong id="score"></strong><p id="summary"></p><button class="primary" id="restart">Παίξε ξανά</button></section></main><script>
const questions=[
{t:'Πρόβλεψε την έξοδο',c:'x ← 10\nx ← x + 5\nx ← x * 2\nΓΡΑΨΕ x',o:['15','20','30','35'],a:2,x:5,h:'Υπολόγισε πρώτα το x + 5 και μετά τον πολλαπλασιασμό.',f:'Το x γίνεται 15 και κατόπιν 30.'},
{t:'Τιμή μεταβλητής',c:'A ← 4\nB ← A + 3\nA ← 10\nΓΡΑΨΕ B',o:['4','7','10','13'],a:1,x:5,h:'Η μεταγενέστερη αλλαγή του A δεν αλλάζει αυτόματα το B.',f:'Το B πήρε την τιμή 7 πριν αλλάξει το A.'},
{t:'Βρες το λάθος',c:'ΔΙΑΒΑΣΕ timi\nekptosi ← timi * 20 / 100\nteliki ← timi + ekptosi\nΓΡΑΨΕ teliki',o:['ΔΙΑΒΑΣΕ timi','ekptosi ← timi * 20 / 100','teliki ← timi + ekptosi','ΓΡΑΨΕ teliki'],a:2,x:10,h:'Η έκπτωση μειώνει την τιμή.',f:'Σωστό: teliki ← timi - ekptosi.'},
{t:'Εμβαδόν ορθογωνίου',c:'ΔΙΑΒΑΣΕ platos, mikos\nE ← ?',o:['platos + mikos','platos * mikos','2 * platos + mikos','platos / mikos'],a:1,x:10,h:'Εμβαδόν = πλάτος επί μήκος.',f:'Το εμβαδόν προκύπτει από τον πολλαπλασιασμό.'},
{t:'Συμπλήρωσε τον κώδικα',c:'ΔΙΑΒΑΣΕ a, b\nmesos ← ?\nΓΡΑΨΕ mesos',o:['a + b / 2','(a + b) / 2','a * b / 2','(a - b) / 2'],a:1,x:10,h:'Πρώτα πρόσθεσε, μετά διαίρεσε με 2.',f:'Οι παρενθέσεις επιβάλλουν πρώτα την πρόσθεση.'},
{t:'Η παγίδα της αντιμετάθεσης',c:'A ← 2\nB ← 5\nA ← B\nB ← A\nΓΡΑΨΕ A, B',o:['2, 5','5, 2','5, 5','2, 2'],a:2,x:10,h:'Μετά την τρίτη εντολή το A έχει γίνει 5.',f:'Και οι δύο μεταβλητές καταλήγουν με τιμή 5.'},
{t:'Αύξηση κατά ένα',c:'x ← x + 1',o:['Μηδενίζει το x','Αυξάνει το x κατά 1','Διπλασιάζει το x','Είναι λανθασμένη'],a:1,x:10,h:'Η δεξιά πλευρά χρησιμοποιεί την παλιά τιμή του x.',f:'Η νέα τιμή του x είναι η παλιά συν 1.'},
{t:'Debugging μέσου όρου',c:'mesos ← a + b / 2',o:['Λείπει ΔΙΑΒΑΣΕ','Χρειάζονται παρενθέσεις','Δεν επιτρέπεται διαίρεση','Το όνομα mesos είναι λάθος'],a:1,x:10,h:'Η διαίρεση προηγείται της πρόσθεσης.',f:'Σωστό: mesos ← (a + b) / 2.'},
{t:'Έκπτωση στην πράξη',c:'Αρχική τιμή: 100€\nΈκπτωση: 20%',o:['20€','80€','100€','120€'],a:1,x:10,h:'Αφαίρεσε 20€ από την αρχική τιμή.',f:'100€ − 20€ = 80€.'},
{t:'Final Boss · έκπτωση και ΦΠΑ',c:'Προϊόν 100€: έκπτωση 20%, έπειτα ΦΠΑ 25% στη μειωμένη τιμή. Πόσο πληρώνουμε;',o:['80€','95€','100€','105€'],a:2,x:25,h:'Μετά την έκπτωση μένουν 80€. Το 25% των 80€ είναι 20€.',f:'80€ + 20€ ΦΠΑ = 100€.'}];
let i=0,xp=0,usedHint=false,locked=false,correct=0,student="";const el=id=>document.getElementById(id);function show(){let q=questions[i];locked=false;usedHint=false;el('count').textContent=`Challenge ${i+1} από 10`;el('badge').textContent=`CHALLENGE ${String(i+1).padStart(2,'0')} · ${q.x} XP`;el('title').textContent=q.t;el('question').textContent=i===9?'Υπολόγισε πρώτα την έκπτωση και έπειτα τον ΦΠΑ.':'Διάλεξε τη σωστή απάντηση.';el('code').textContent=q.c;el('choices').replaceChildren();q.o.forEach((v,j)=>{let l=document.createElement('label'),r=document.createElement('input');l.className='option';r.type='radio';r.name='answer';r.value=j;l.append(r,document.createTextNode(v));el('choices').append(l)});el('feedback').classList.add('hidden');el('next').classList.add('hidden');el('check').disabled=false;el('hint').disabled=false}el('hint').onclick=()=>{if(locked)return;usedHint=true;el('feedback').textContent='💡 '+questions[i].h;el('feedback').classList.remove('hidden')};el('check').onclick=()=>{if(locked)return;let picked=document.querySelector('input[name=answer]:checked');if(!picked){el('feedback').textContent='Επίλεξε πρώτα μία απάντηση.';el('feedback').classList.remove('hidden');return}locked=true;let q=questions[i],ok=Number(picked.value)===q.a,gain=ok?Math.max(1,q.x-(usedHint?5:0)):0;if(ok)correct++;xp+=gain;el('xp').textContent=xp;el('bar').style.width=xp+'%';el('feedback').textContent=(ok?`✓ Σωστά! +${gain} XP. `:'Δες τη λύση: ')+q.f;el('feedback').classList.remove('hidden');el('check').disabled=el('hint').disabled=true;el('choices').querySelectorAll('input').forEach(r=>r.disabled=true);el('next').classList.remove('hidden');el('next').textContent=i===9?'Δες το αποτέλεσμα':'Επόμενο challenge →'};el('start').onclick=()=>{student=el('studentName').value.trim();if(!student){el('nameError').classList.remove('hidden');el('studentName').focus();return}el('nameError').classList.add('hidden');el('player').textContent='Παίκτης: '+student;el('entry').classList.add('hidden');el('game').classList.remove('hidden')};el('studentName').addEventListener('keydown',e=>{if(e.key==='Enter')el('start').click()});el('next').onclick=()=>{i++;if(i<questions.length)show();else{el('game').classList.add('hidden');el('finish').classList.remove('hidden');el('finalName').textContent=student;el('score').textContent=xp+' / 100 XP';el('summary').textContent=`Σωστές απαντήσεις: ${correct}/10. `+(xp>=80?'Είσαι έτοιμος για το Level 2: Δομή Επιλογής.':`Χρειάζεσαι ακόμη ${80-xp} XP για τον στόχο των 80. Δοκίμασε ξανά.`)}};el('restart').onclick=()=>{i=xp=correct=0;el('xp').textContent='0';el('bar').style.width='0%';el('finish').classList.add('hidden');el('game').classList.remove('hidden');show()};show();
</script></body></html>
